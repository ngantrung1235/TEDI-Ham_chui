[project]
name = "bentley-mcp-core"
version = "0.3.0"
description = "Phan chung cho MCP server cac san pham Bentley nen MicroStation (OpenTunnel, OpenBridge...)"
requires-python = ">=3.10"
dependencies = [
    "mcp-bridge-common",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bentley_mcp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Phan trung lap nam trong repo (Mcp_Common/python). Voi pip:
#   pip install -e ../../Mcp_Common/python -e .
[tool.uv.sources]
mcp-bridge-common = { path = "../../Mcp_Common/python", editable = true }
