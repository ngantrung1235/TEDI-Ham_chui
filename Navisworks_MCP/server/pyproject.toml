[project]
name = "nw-mcp"
version = "0.1.0"
description = "MCP server dieu khien Autodesk Navisworks Manage 2025 qua plugin NwMcpBridge"
requires-python = ">=3.10"
dependencies = [
    "mcp-bridge-common",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tree-sitter>=0.23", "tree-sitter-c-sharp>=0.23"]

[project.scripts]
nw-mcp = "nw_mcp.server:main"

# Phan trung lap nam trong repo (Mcp_Common/python). Voi pip:
#   pip install -e ../../Mcp_Common/python -e .
[tool.uv.sources]
mcp-bridge-common = { path = "../../Mcp_Common/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
