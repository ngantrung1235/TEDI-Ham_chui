[project]
name = "obd-mcp"
version = "0.2.0"
description = "MCP server dieu khien Bentley OpenBridge Designer 2026 qua add-in OBDMcpBridge"
requires-python = ">=3.10"
dependencies = [
    "bentley-mcp-core",
    "mcp-bridge-common",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
obd-mcp = "obd_mcp.server:main"

# Phan chung nam trong repo. Voi pip:
#   pip install -e ../../Mcp_Common/python -e ../../Bentley_MCP_Core/python -e .
[tool.uv.sources]
bentley-mcp-core = { path = "../../Bentley_MCP_Core/python", editable = true }
mcp-bridge-common = { path = "../../Mcp_Common/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
