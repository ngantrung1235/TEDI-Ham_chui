[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plaxis3d-mcp"
version = "0.2.0"
description = "MCP server linking Claude Code / Claude Desktop with PLAXIS 3D (remote scripting)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "plxscripting>=1.0.4",
]

[project.optional-dependencies]
io = ["ezdxf>=1.1", "openpyxl>=3.1"]
test = ["pytest>=7"]
all = ["ezdxf>=1.1", "openpyxl>=3.1", "pytest>=7"]

[project.scripts]
plaxis3d-mcp = "plaxis3d_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
