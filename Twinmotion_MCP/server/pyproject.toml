[project]
name = "tm-mcp"
version = "0.1.0"
description = "MCP server dieu khien Twinmotion 2026.1 (For Revit) o tang giao dien - chi chay tren Windows"
requires-python = ">=3.10"
dependencies = [
    "mcp-bridge-common",
    "mcp>=1.2",
    "pillow>=10",
    "psutil>=5.9",
]

[project.optional-dependencies]
uia = ["pywinauto>=0.6.8; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
tm-mcp = "tm_mcp.server:main"

# Phan trung lap nam trong repo (Mcp_Common/python). Voi pip:
#   pip install -e ../../Mcp_Common/python -e .
[tool.uv.sources]
mcp-bridge-common = { path = "../../Mcp_Common/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
